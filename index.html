<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3b26">
<title>Masak Simpel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app HP — header hijau melengkung, carousel "paling cepat", kategori ikon bulat, grid kartu, nav bawah */
:root{
  --bg:#f5f7f2;--surface:#ffffff;--fg:#12241a;--muted:#6b7a70;--line:#e4ebe2;
  --deep:#0f3b26;--deep2:#17573a;--accent:#1f8a52;--accent-soft:#e3f3e8;--tang:#ff7a1a;--tang-soft:#fff0e3;--sun:#ffc53d;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --sh:0 2px 4px rgba(15,59,38,.05),0 12px 28px rgba(15,59,38,.10);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b130e;--surface:#152119;--fg:#ecf3ee;--muted:#9db1a3;--line:#23342a;
  --deep:#0a2a1a;--deep2:#103a25;--accent:#5fd393;--accent-soft:#183324;--tang:#ff9447;--tang-soft:#3a2414;
  --sh:0 2px 4px rgba(0,0,0,.3),0 12px 28px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-gutter:stable;overflow-y:scroll}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;overscroll-behavior-y:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.in{max-width:980px;margin:0 auto;padding:0 16px}
.emo{filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));display:inline-block}

/* Header */
.hero{background:radial-gradient(120% 90% at 100% 0%,var(--deep2) 0%,var(--deep) 60%);color:#fff;padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:84px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.2px);background-size:18px 18px;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;position:relative}
.greet{font-size:.85rem;opacity:.8;font-weight:600}
.logo{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:1.3rem}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,8.5vw,3.4rem);line-height:1;letter-spacing:-.025em;margin:14px 0 0;max-width:12ch;position:relative;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--sun)}
.float{position:absolute;right:14px;bottom:62px;font-size:4.6rem;transform:rotate(-12deg);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-6deg) translateY(-6px)}}

/* Search */
.bar{position:sticky;top:0;z-index:5;margin-top:-34px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:20px;padding:0 8px 0 18px;height:60px;box-shadow:var(--sh)}
.search svg{flex:none;color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font:inherit;font-size:16px;font-weight:500;color:var(--fg);height:100%}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
#clr{width:44px;height:44px;border-radius:14px;background:var(--bg);color:var(--muted);font-size:1rem}

h2.h{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
h2.h small{font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--muted)}
section.blk{margin-top:26px;display:grid;gap:14px}

/* Categories */
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cat{display:grid;justify-items:center;gap:7px;font-size:.78rem;font-weight:700;color:var(--muted)}
.cat .ic{width:100%;max-width:64px;aspect-ratio:1;border-radius:22px;background:var(--surface);box-shadow:var(--sh);display:grid;place-items:center;font-size:1.7rem;transition:transform .2s,background .2s}
.cat[aria-pressed="true"]{color:var(--fg)}
.cat[aria-pressed="true"] .ic{background:var(--tang);transform:translateY(-3px)}

/* Carousel */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:4px 16px 14px}
.rail::-webkit-scrollbar{display:none}
.fcard{flex:none;width:min(78vw,300px);scroll-snap-align:start;border-radius:26px;padding:18px;color:#12241a;display:grid;grid-template-columns:1fr auto;align-items:end;min-height:150px;position:relative;overflow:hidden;text-align:left;box-shadow:var(--sh)}
.fcard .t{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.1}
.fcard .m{font-size:.78rem;font-weight:700;margin-top:6px;opacity:.75}
.fcard .badge{position:absolute;top:14px;left:14px;background:#12241a;color:#fff;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.04em}
.fcard .emo{font-size:4.2rem;transform:rotate(8deg) translate(6px,6px)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--sh);display:flex;flex-direction:column;text-align:left;padding:8px;position:relative;transition:transform .2s}
.card:active{transform:scale(.97)}
@media (hover:hover){.card:hover{transform:translateY(-4px)}}
.art{aspect-ratio:1/0.85;border-radius:18px;display:grid;place-items:center;font-size:3.6rem;position:relative;overflow:hidden}
.art::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.45)}
.art .emo{position:relative}
.time{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.95);color:#12241a;font-size:.7rem;font-weight:800;padding:4px 9px;border-radius:999px}
.fav{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:.95rem;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.cbody{padding:10px 6px 6px;display:grid;gap:2px}
.cbody .k{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--tang)}
.cbody h3{font-family:var(--display);font-weight:600;font-size:1.04rem;line-height:1.2;margin:0}
.cbody .sub{font-size:.75rem;color:var(--muted);font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px;font-weight:500}
.empty b{display:block;font-size:2.8rem}
.card:focus-visible,.cat:focus-visible,.fcard:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:8;background:var(--deep);border-radius:24px;padding:6px;display:flex;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.nav button{color:rgba(255,255,255,.7);font-weight:700;font-size:.85rem;padding:12px 22px;border-radius:18px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.nav button[aria-pressed="true"]{background:var(--tang);color:#fff}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.shero{height:280px;display:grid;place-items:center;font-size:7.5rem;position:relative;overflow:hidden}
.shero::before{content:"";position:absolute;width:260px;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.45)}
.shero .emo{position:relative;animation:bob 4s ease-in-out infinite}
.sbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.95);color:#12241a;font-size:1.15rem;box-shadow:var(--sh);display:grid;place-items:center;z-index:2}
.sbody{background:var(--bg);border-radius:30px 30px 0 0;margin-top:-30px;position:relative;padding:26px 0 calc(env(safe-area-inset-bottom,0px) + 40px)}
.sbody .in{max-width:660px;display:grid;gap:26px}
.sbody h2{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.02;margin:6px 0 0;letter-spacing:-.02em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stats div{background:var(--surface);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--sh)}
.stats b{display:block;font-family:var(--display);font-size:1.3rem}
.stats span{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sec h4{font-family:var(--display);font-size:1.25rem;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.sec h4 small{font-family:var(--body);font-size:.78rem;color:var(--accent);font-weight:700}
.ings{background:var(--surface);border-radius:22px;padding:6px 16px;box-shadow:var(--sh)}
.ings label{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-weight:500}
.ings label:last-child{border:0}
.ings input{appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin:0;transition:.15s}
.ings input:checked{background:var(--accent);border-color:var(--accent)}
.ings input:checked::after{content:"✓";color:#fff;font-size:.8rem;font-weight:800}
.ings input:checked+span{text-decoration:line-through;color:var(--muted)}
.steps{display:grid;gap:0;position:relative}
.st{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.st::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st .n{width:44px;height:44px;border-radius:15px;background:var(--deep);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.05rem}
.st .box{background:var(--surface);border-radius:20px;box-shadow:var(--sh);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 88px}
.st .tx{padding:14px 14px 14px 16px;font-weight:500;align-self:center}
.st .pic{display:grid;place-items:center;font-size:2.4rem}
.tip{background:var(--tang-soft);border-radius:20px;padding:16px 18px;font-size:.93rem;display:flex;gap:12px;align-items:flex-start}
.tip b{font-size:1.4rem;line-height:1}
.video{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#000;box-shadow:var(--sh)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytlink{display:inline-block;margin-top:10px;color:var(--tang);font-weight:700;font-size:.88rem;text-decoration:none}
body.lock{overflow:hidden}
[hidden]{display:none!important}
.sw{display:flex;gap:10px;align-items:center}
.sw .search{flex:1;min-width:0}
.fbtn{flex:none;width:60px;height:60px;border-radius:20px;background:var(--tang);color:#fff;display:grid;place-items:center;box-shadow:var(--sh);position:relative}
.fbtn .dot{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--deep);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.36)}
.art .photo{border-radius:18px}
.art.has::before,.shero.has::before{display:none}
.art.has::after,.shero.has::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35))}
.art .time{z-index:1}
.fcard.has{color:#fff}
.fcard.has::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72))}
.fcard>*{position:relative;z-index:1}
.fcard .photo{z-index:0;position:absolute}
.match{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;justify-self:start;margin-top:4px}
.match.ok{background:var(--accent-soft);color:var(--accent)}
.match.no{background:var(--tang-soft);color:var(--tang)}
.fs{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,15,10,.5);opacity:0;visibility:hidden;transition:.25s}
.fs.on{opacity:1;visibility:visible}
.fpanel{background:var(--bg);width:100%;max-width:640px;max-height:86%;border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .3s}
.fs.on .fpanel{transform:none}
.fhead{padding:20px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.fhead h3{font-family:var(--display);font-size:1.4rem;margin:0}
.fhead p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.fbody{overflow-y:auto;padding:6px 20px 16px;display:grid;gap:18px}
.fg b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.fg .chips2{display:flex;flex-wrap:wrap;gap:8px}
.ing2{height:40px;padding:0 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:.88rem}
.ing2[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ffoot{display:flex;gap:10px;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--line)}
.ffoot button{height:52px;border-radius:16px;font-weight:800}
#fReset{padding:0 20px;background:var(--surface);border:1px solid var(--line)}
#fApply{flex:1;background:var(--deep);color:#fff}
.credit{font-size:.75rem;color:var(--muted);text-align:center;margin:30px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

$("greet").textContent=h<11?"Selamat pagi 👋":h<15?"Selamat siang 👋":h<18?"Selamat sore 👋":"Selamat malam 👋";

function drawCats(){
  $("cats").innerHTML=CATS.map(([c,e])=>`<button class="cat" aria-pressed="${c===cat}" data-c="${c}"><span class="ic">${e}</span>${c}</button>`).join("");
  $("cats").querySelectorAll(".cat").forEach(b=>b.onclick=()=>{cat=b.dataset.c;drawCats();drawGrid()});
}
function drawRail(){
  $("rail").innerHTML=R.filter(r=>r.t<=10).map(r=>`<button class="fcard has" style="background:${r.c}" data-i="${R.indexOf(r)}">${ph(r)}
    <span class="badge">⚡ ${r.t} MENIT</span><div><div class="t">${r.n}</div><div class="m">${r.k} · ${r.s.length} langkah</div></div></button>`).join("");
  $("rail").querySelectorAll(".fcard").forEach(c=>c.onclick=()=>openR(R[c.dataset.i]));
}
function drawGrid(){
  const words=$("q").value.toLowerCase().split(/[,\s]+/).filter(Boolean);
  $("clr").hidden=!words.length;
  const searching=words.length>0;
  const byIng=have.size>0;
  $("fDot").hidden=!byIng;$("fDot").textContent=have.size;
  $("fastBlk").hidden=searching||byIng||view==="fav";
  let list=R.filter(r=>(cat==="Semua"||r.k===cat)&&words.every(w=>(r.n+" "+r.b.join(" ")).toLowerCase().includes(w)));
  if(view==="fav")list=list.filter(r=>favs.has(r.n));
  if(byIng)list=list.filter(r=>r.i.some(x=>have.has(x))).sort((a,b)=>miss(a).length-miss(b).length);
  $("ttl").textContent=view==="fav"?"Favoritku":byIng?"Cocok dengan bahanmu":searching?"Hasil pencarian":cat==="Semua"?"Semua menu":"Menu "+cat;
  $("count").textContent=list.length+" menu";
  $("grid").innerHTML=list.length?list.map(r=>`<div class="card" tabindex="0" role="button" data-i="${R.indexOf(r)}">
      <button class="fav" data-f="${r.n}" aria-label="Favorit">${favs.has(r.n)?"❤️":"🤍"}</button>
      <div class="art has" style="background:${r.c}"><span class="emo">${r.e}</span>${ph(r)}<span class="time">⏱ ${r.t} mnt</span></div>
      <div class="cbody"><span class="k">${r.k}</span><h3>${r.n}</h3><span class="sub">${r.b.length} bahan · ▶ video</span>${byIng?(miss(r).length?`<span class="match no">Kurang: ${miss(r).join(", ")}</span>`:`<span class="match ok">✓ Bahan lengkap</span>`):""}</div></div>`).join("")
    :`<div class="empty"><b>${view==="fav"?"🤍":"🥄"}</b>${view==="fav"?"Belum ada favorit. Ketuk 🤍 di menu yang kamu suka.":"Belum ada menu yang cocok.<br>Coba kata lain, misalnya “telur” atau “sop”."}</div>`;
  $("grid").querySelectorAll(".card").forEach(c=>{c.onclick=()=>openR(R[c.dataset.i]);c.onkeydown=e=>{if(e.key==="Enter")openR(R[c.dataset.i])}});
  $("grid").querySelectorAll(".fav").forEach(b=>b.onclick=e=>{e.stopPropagation();const n=b.dataset.f;favs.has(n)?favs.delete(n):favs.add(n);saveFav();drawGrid()});
}
function setView(v){view=v;$("nHome").setAttribute("aria-pressed",v==="home");$("nFav").setAttribute("aria-pressed",v==="fav");drawGrid();window.scrollTo({top:0})}
$("nHome").onclick=()=>setView("home");$("nFav").onclick=()=>setView("fav");

function openR(r){
  const isF=favs.has(r.n);
  $("sheet").innerHTML=`<div class="shero has" style="background:${r.c}"><span class="emo">${r.e}</span>${ph(r)}
    <button class="sbtn" id="back" style="left:16px" aria-label="Kembali">←</button>
    <button class="sbtn" id="sfav" style="right:16px" aria-label="Favorit">${isF?"❤️":"🤍"}</button></div>
  <div class="sbody"><div class="in">
    <div><span style="font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tang)">${r.k}</span>
      <h2>${r.n}</h2>
      <div class="stats"><div><b>${r.t}</b><span>menit</span></div><div><b>${r.b.length}</b><span>bahan</span></div><div><b>${r.s.length}</b><span>langkah</span></div></div></div>
    <section class="sec"><h4>Bahan <small id="ready">0/${r.b.length} siap</small></h4>
      <div class="ings">${r.b.map((x,i)=>`<label><input type="checkbox" id="b${i}"><span>${x}</span></label>`).join("")}</div></section>
    <section class="sec"><h4>Cara memasak</h4><div class="steps">${r.s.map((x,i)=>{const p=pic(x);
      return `<div class="st"><div class="n">${i+1}</div><div class="box"><div class="tx">${x}</div><div class="pic" style="background:${p[2]}"><span class="emo">${p[1]}</span></div></div></div>`}).join("")}</div></section>
    ${r.tip?`<div class="tip"><b>💡</b><div><strong>Tips</strong><br>${r.tip}</div></div>`:""}
    <section class="sec"><h4>Tonton videonya</h4>
      <div class="video"><iframe src="https://www.youtube.com/embed/${r.v}" title="Video ${r.n}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
      <a class="ytlink" href="https://www.youtube.com/watch?v=${r.v}" target="_blank" rel="noopener">Video tidak muncul? Buka di YouTube ↗</a></section>
  </div></div>`;
  const upd=()=>$("ready").textContent=$("sheet").querySelectorAll(".ings input:checked").length+"/"+r.b.length+" siap";
  $("sheet").querySelectorAll(".ings input").forEach(i=>i.onchange=upd);
  $("sfav").onclick=()=>{favs.has(r.n)?favs.delete(r.n):favs.add(r.n);saveFav();$("sfav").textContent=favs.has(r.n)?"❤️":"🤍";drawGrid()};
  $("sheet").scrollTop=0;
  $("sheet").classList.add("on");document.body.classList.add("lock");
  $("back").onclick=closeR;
  history.pushState({r:1},"");
}
function closeR(fromPop){
  if(!$("sheet").classList.contains("on"))return;
  $("sheet").classList.remove("on");document.body.classList.remove("lock");
  setTimeout(()=>{if(!$("sheet").classList.contains("on"))$("sheet").innerHTML=""},380);
  if(fromPop!==true)history.back();
}
window.addEventListener("popstate",()=>closeR(true));
$("q").addEventListener("input",drawGrid);
$("clr").onclick=e=>{e.preventDefault();$("q").value="";drawGrid();$("q").focus()};
drawCats();drawRail();drawGrid();
</script>
</body>
</html>
